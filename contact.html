<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Tirth Gadhiya</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 4rem;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .info-icon {
            width: 40px;
            height: 40px;
            background: var(--grad-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .contact-form {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--glass-blur);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            outline: none;
            transition: var(--transition-fast);
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--secondary-color);
            background: rgba(255, 255, 255, 0.07);
        }
    </style>
</head>
<body>
    <div class="x-bg-glow"></div>
    <canvas id="particle-canvas"></canvas>

    <nav>
        <div class="container nav-content">
            <a href="index.html" style="font-weight: 800; color: white; text-decoration: none; font-size: 1.5rem; letter-spacing: 2px;">TIRTH.AI</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section>
            <h1 class="reveal">Get In Touch</h1>
            <div class="contact-grid">
                <div class="contact-info reveal">
                    <div class="info-item tilt-card">
                        <div class="tilt-content" style="display: flex; align-items: center; gap: 1.5rem;">
                            <div class="info-icon">@</div>
                            <div>
                                <div style="font-size: 0.8rem; color: var(--text-muted);">Email</div>
                                <div style="font-weight: 600;">tirthgadhiya00@gmail.com</div>
                            </div>
                        </div>
                    </div>
                    <div class="info-item tilt-card">
                        <div class="tilt-content" style="display: flex; align-items: center; gap: 1.5rem;">
                            <div class="info-icon">✆</div>
                            <div>
                                <div style="font-size: 0.8rem; color: var(--text-muted);">Phone</div>
                                <div style="font-weight: 600;">+91 8866338308</div>
                            </div>
                        </div>
                    </div>
                    <div class="info-item tilt-card">
                        <div class="tilt-content" style="display: flex; align-items: center; gap: 1.5rem;">
                            <div class="info-icon">📍</div>
                            <div>
                                <div style="font-size: 0.8rem; color: var(--text-muted);">Location</div>
                                <div style="font-weight: 600;">Surat, Gujarat, India</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="contact-form reveal tilt-card">
                    <div class="tilt-content">
                        <form onsubmit="event.preventDefault(); alert('Message sent! (Simulation)');">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" placeholder="Your Name" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" placeholder="Your Email" required>
                            </div>
                            <div class="form-group">
                                <label>Message</label>
                                <textarea rows="5" placeholder="Your Message" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/particles.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
